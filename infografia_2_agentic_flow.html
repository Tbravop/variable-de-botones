<!DOCTYPE html>
<html lang="es" data-fps="30" data-duration="10" data-width="1920" data-height="1080">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Infografía 02: Agentic Code Workflow // Minimalist Bento Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800;900&family=Montserrat:wght@800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg-midnight: #0B0F19;
      --card-bg: rgba(19, 26, 42, 0.94);
      --card-border: #232E47;
      
      --cyan: #38BDF8;
      --cyan-glow: rgba(56, 189, 248, 0.45);
      
      --purple: #A855F7;
      --purple-glow: rgba(168, 85, 247, 0.5);
      
      --emerald: #10B981;
      --emerald-glow: rgba(16, 185, 129, 0.45);
      
      --text-white: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-midnight);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
    }

    #stage-scaler {
      position: absolute;
      width: 1920px;
      height: 1080px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      background: radial-gradient(circle at 50% 25%, #151F38 0%, #0B0F19 65%, #060911 100%);
      overflow: hidden;
      box-shadow: 0 0 120px rgba(0, 0, 0, 0.95);
    }

    /* Architectural Tech Grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* Ambient Glow Spots */
    .glow-spot {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      opacity: 0.15;
    }

    /* BENTO GRID CANVAS */
    .bento-container {
      position: absolute;
      top: 60px;
      left: 90px;
      right: 90px;
      height: 720px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      z-index: 10;
    }

    /* COMMON BENTO CARD */
    .bento-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1.5px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* TOP WIDE BANNER CARD */
    .banner-card {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 50px;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
    }

    .banner-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--text-white);
      text-transform: uppercase;
      line-height: 1;
    }

    .banner-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: rgba(168, 85, 247, 0.12);
      border: 1.5px solid var(--purple);
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 800;
      color: var(--purple);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 0 0 20px var(--purple-glow);
    }

    .banner-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 10px var(--purple);
    }

    /* 3 EQUAL VERTICAL BENTO CARDS */
    .cards-row {
      width: 100%;
      height: 568px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 32px;
      position: relative;
    }

    .vertical-card {
      height: 100%;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      opacity: 0;
      transform: translateY(35px);
    }

    /* Top Accent Indicator */
    .card-accent-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Sharp Vector Icon Box */
    .icon-hero-box {
      width: 130px;
      height: 130px;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 20px 0;
      transition: all 0.4s ease;
    }

    .icon-hero-box svg {
      width: 68px;
      height: 68px;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .sonar-ring {
      position: absolute;
      inset: -12px;
      border-radius: 40px;
      opacity: 0;
      pointer-events: none;
    }

    /* Card Big Bold Title */
    .card-hero-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--text-white);
      text-transform: uppercase;
      line-height: 1.1;
    }

    /* Visual Schematic Box (Subtle 3D / Keynote Aesthetic) */
    .card-visual-plate {
      width: 100%;
      height: 120px;
      border-radius: 16px;
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-visual-plate svg {
      width: 70px;
      height: 70px;
      fill: none;
      stroke-width: 1.8;
    }

    /* SPECIFIC CARD STYLES */

    /* Card 1: Electric Cyan #38BDF8 */
    .card-1 {
      border-top: 3px solid var(--cyan);
    }
    .card-1 .card-accent-pill {
      color: var(--cyan);
      border-color: rgba(56, 189, 248, 0.35);
      background: rgba(56, 189, 248, 0.1);
    }
    .card-1 .icon-hero-box {
      background: rgba(56, 189, 248, 0.1);
      border: 2px solid var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 35px var(--cyan-glow);
    }
    .card-1 .card-visual-plate svg {
      stroke: var(--cyan);
      filter: drop-shadow(0 0 10px var(--cyan-glow));
    }
    .card-1.active {
      border-color: var(--cyan);
      box-shadow: 0 25px 60px rgba(56, 189, 248, 0.25);
      transform: translateY(-8px);
    }

    /* Card 2: Neon Purple #A855F7 */
    .card-2 {
      border: 2px solid var(--purple);
      box-shadow: 0 20px 50px -10px var(--purple-glow), inset 0 0 35px rgba(168, 85, 247, 0.12);
    }
    .card-2 .card-accent-pill {
      color: var(--purple);
      border-color: var(--purple);
      background: rgba(168, 85, 247, 0.15);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
    }
    .card-2 .icon-hero-box {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(11, 15, 25, 0.9));
      border: 2px solid var(--purple);
      color: var(--purple);
      box-shadow: 0 0 45px var(--purple-glow);
    }
    .card-2 .card-visual-plate svg {
      stroke: var(--purple);
      filter: drop-shadow(0 0 12px var(--purple-glow));
    }
    .card-2.active {
      box-shadow: 0 25px 70px rgba(168, 85, 247, 0.4), inset 0 0 45px rgba(168, 85, 247, 0.2);
      transform: translateY(-8px) scale(1.02);
    }

    /* Card 3: Emerald Green #10B981 */
    .card-3 {
      border-top: 3px solid var(--emerald);
    }
    .card-3 .card-accent-pill {
      color: var(--emerald);
      border-color: rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.1);
    }
    .card-3 .icon-hero-box {
      background: rgba(16, 185, 129, 0.1);
      border: 2px solid var(--emerald);
      color: var(--emerald);
      box-shadow: 0 0 35px var(--emerald-glow);
    }
    .card-3 .card-visual-plate svg {
      stroke: var(--emerald);
      filter: drop-shadow(0 0 10px var(--emerald-glow));
    }
    .card-3.active {
      border-color: var(--emerald);
      box-shadow: 0 25px 60px rgba(16, 185, 129, 0.25);
      transform: translateY(-8px);
    }

    /* CONNECTING LASER BEAMS BETWEEN CARDS */
    #connecting-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
    }

    .laser-wire {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-dasharray: 6 6;
    }

    .laser-active {
      fill: none;
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-dashoffset: 600;
    }

    .laser-packet {
      fill: #FFFFFF;
      opacity: 0;
    }

    /* TV PROGRESS TRACK (At bottom edge) */
    .tv-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 50;
    }

    .tv-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--emerald));
      box-shadow: 0 0 15px var(--purple);
    }
  </style>
</head>
<body>

  <div id="stage-scaler" data-composition-id="agentic_workflow" data-width="1920" data-height="1080" data-duration="10">
    <div class="bg-grid"></div>

    <!-- Ambient Glow Spots -->
    <div class="glow-spot" style="top: 20%; left: 15%; width: 450px; height: 450px; background: var(--cyan);"></div>
    <div class="glow-spot" style="top: 20%; left: 50%; transform: translateX(-50%); width: 600px; height: 600px; background: var(--purple);"></div>
    <div class="glow-spot" style="top: 20%; right: 15%; width: 450px; height: 450px; background: var(--emerald);"></div>

    <!-- BENTO GRID CANVAS (4 CARDS TOTAL) -->
    <div class="bento-container">

      <!-- CARD 0: TOP WIDE BANNER CARD -->
      <div class="bento-card banner-card" id="banner-card">
        <h1 class="banner-title">AGENTIC CODE WORKFLOW</h1>
        <div class="banner-badge">
          <div class="dot"></div>
          2026 BENTO PIPELINE
        </div>
      </div>

      <!-- 3 EQUAL VERTICAL BENTO CARDS -->
      <div class="cards-row">

        <!-- SVG CONNECTING LASER BEAMS -->
        <svg id="connecting-svg" viewBox="0 0 1740 568">
          <!-- Wire 1: Card 1 to Card 2 (Right edge of Card 1 ~ 558 to Left edge of Card 2 ~ 590) -->
          <path class="laser-wire" d="M 558 284 L 590 284" />
          <path id="laser-1" class="laser-active" stroke="var(--cyan)" filter="drop-shadow(0 0 8px var(--cyan))" d="M 558 284 L 590 284" />
          <circle id="pkt-1" class="laser-packet" r="6" filter="drop-shadow(0 0 10px var(--cyan))" />

          <!-- Wire 2: Card 2 to Card 3 (Right edge of Card 2 ~ 1150 to Left edge of Card 3 ~ 1182) -->
          <path class="laser-wire" d="M 1150 284 L 1182 284" />
          <path id="laser-2" class="laser-active" stroke="var(--purple)" filter="drop-shadow(0 0 8px var(--purple))" d="M 1150 284 L 1182 284" />
          <circle id="pkt-2" class="laser-packet" r="6" filter="drop-shadow(0 0 10px var(--purple))" />
        </svg>

        <!-- CARD 1: ELECTRIC CYAN (#38BDF8) // 01 INCEPTION -->
        <div class="bento-card vertical-card card-1" id="card-1">
          <div class="card-accent-pill">FASE 01</div>
          
          <div class="icon-hero-box">
            <!-- Vector User / Architect Icon -->
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <div class="sonar-ring" id="sonar-1" style="border: 2px solid var(--cyan);"></div>
          </div>

          <h2 class="card-hero-title">01 INCEPTION</h2>

          <!-- Clean Vector Blueprint Plate -->
          <div class="card-visual-plate">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 2"/>
              <path d="M9 3v18"/>
              <path d="M15 9h6"/>
              <circle cx="6" cy="7" r="1.5" fill="currentColor"/>
              <circle cx="6" cy="12" r="1.5" fill="currentColor"/>
            </svg>
          </div>
        </div>

        <!-- CARD 2: NEON PURPLE (#A855F7) // 02 AI CODE -->
        <div class="bento-card vertical-card card-2" id="card-2">
          <div class="card-accent-pill">FASE 02</div>

          <div class="icon-hero-box">
            <!-- Glowing AI Microchip Icon -->
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <rect x="4" y="4" width="16" height="16" rx="2"/>
              <rect x="9" y="9" width="6" height="6"/>
              <line x1="9" y1="1" x2="9" y2="4"/>
              <line x1="15" y1="1" x2="15" y2="4"/>
              <line x1="9" y1="20" x2="9" y2="23"/>
              <line x1="15" y1="20" x2="15" y2="23"/>
              <line x1="20" y1="9" x2="23" y2="9"/>
              <line x1="20" y1="15" x2="23" y2="15"/>
              <line x1="1" y1="9" x2="4" y2="9"/>
              <line x1="1" y1="15" x2="4" y2="15"/>
            </svg>
            <div class="sonar-ring" id="sonar-2" style="border: 2px solid var(--purple);"></div>
          </div>

          <h2 class="card-hero-title">02 AI CODE</h2>

          <!-- Clean 3D Isometric Microchip Plate -->
          <div class="card-visual-plate">
            <svg viewBox="0 0 100 100">
              <polygon points="50,15 85,35 85,75 50,95 15,75 15,35" stroke="var(--purple)" stroke-width="2.5" fill="rgba(168,85,247,0.15)"/>
              <polygon points="50,30 72,42 72,66 50,78 28,66 28,42" stroke="#FFFFFF" stroke-width="2" fill="rgba(255,255,255,0.08)"/>
              <circle cx="50" cy="54" r="5" fill="var(--purple)"/>
            </svg>
          </div>
        </div>

        <!-- CARD 3: EMERALD GREEN (#10B981) // 03 REVIEW -->
        <div class="bento-card vertical-card card-3" id="card-3">
          <div class="card-accent-pill">FASE 03</div>

          <div class="icon-hero-box">
            <!-- Clean Checkmark Shield Icon -->
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <polyline points="9 12 11 14 15 10"/>
            </svg>
            <div class="sonar-ring" id="sonar-3" style="border: 2px solid var(--emerald);"></div>
          </div>

          <h2 class="card-hero-title">03 REVIEW</h2>

          <!-- Clean Verified Git Merge Plate -->
          <div class="card-visual-plate">
            <svg viewBox="0 0 24 24">
              <circle cx="18" cy="18" r="3"/>
              <circle cx="6" cy="6" r="3"/>
              <circle cx="6" cy="18" r="3"/>
              <path d="M6 9v6"/>
              <path d="M9 6h5a4 4 0 0 1 4 4v5"/>
            </svg>
          </div>
        </div>

      </div>

    </div>

    <!-- TV PROGRESS BAR -->
    <div class="tv-progress-track">
      <div class="tv-progress-fill" id="progress-bar"></div>
    </div>
  </div>

  <script>
    function updateScale() {
      const scaler = document.getElementById('stage-scaler');
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY);
      scaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', updateScale);
    updateScale();

    window.addEventListener('DOMContentLoaded', () => {
      const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.5 });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') tl.paused(!tl.paused());
        if (e.code === 'KeyR') tl.restart();
      });

      tl.to("#progress-bar", { width: "100%", duration: 10, ease: "none" }, 0);

      const p1 = document.getElementById("laser-1");
      const len1 = p1.getTotalLength() + 5;
      gsap.set(p1, { strokeDasharray: len1, strokeDashoffset: len1 });

      const p2 = document.getElementById("laser-2");
      const len2 = p2.getTotalLength() + 5;
      gsap.set(p2, { strokeDasharray: len2, strokeDashoffset: len2 });

      gsap.set("#banner-card", { opacity: 0, y: -20 });
      gsap.set(["#card-1", "#card-2", "#card-3"], { opacity: 0, y: 35 });

      // 1. Top Banner entrance (0.3s)
      tl.to("#banner-card", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.3);

      // 2. Card 1 (01 INCEPTION) entrance (0.8s)
      tl.to("#card-1", {
        opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)",
        onStart: () => document.getElementById("card-1").classList.add("active")
      }, 0.8);

      tl.fromTo("#sonar-1",
        { scale: 0.8, opacity: 1 },
        { scale: 2.2, opacity: 0, duration: 0.7, ease: "power2.out" },
        1.0
      );

      // 3. Laser stream Card 1 to Card 2 (2.6s)
      tl.to(p1, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 2.6);
      tl.set("#pkt-1", { opacity: 1 }, 2.6);
      tl.to("#pkt-1", {
        duration: 0.6,
        ease: "power2.inOut",
        onUpdate: function() {
          const pt = p1.getPointAtLength(this.progress() * len1);
          const el = document.getElementById("pkt-1");
          el.setAttribute("cx", pt.x);
          el.setAttribute("cy", pt.y);
        }
      }, 2.6);
      tl.set("#pkt-1", { opacity: 0 }, 3.2);

      // 4. Card 2 (02 AI CODE) entrance (3.2s)
      tl.to("#card-2", {
        opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)",
        onStart: () => {
          document.getElementById("card-1").classList.remove("active");
          document.getElementById("card-2").classList.add("active");
        }
      }, 3.2);

      tl.fromTo("#sonar-2",
        { scale: 0.8, opacity: 1 },
        { scale: 2.3, opacity: 0, duration: 0.7, ease: "power2.out" },
        3.4
      );

      // 5. Laser stream Card 2 to Card 3 (5.8s)
      tl.to(p2, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 5.8);
      tl.set("#pkt-2", { opacity: 1 }, 5.8);
      tl.to("#pkt-2", {
        duration: 0.6,
        ease: "power2.inOut",
        onUpdate: function() {
          const pt = p2.getPointAtLength(this.progress() * len2);
          const el = document.getElementById("pkt-2");
          el.setAttribute("cx", pt.x);
          el.setAttribute("cy", pt.y);
        }
      }, 5.8);
      tl.set("#pkt-2", { opacity: 0 }, 6.4);

      // 6. Card 3 (03 REVIEW) entrance (6.4s)
      tl.to("#card-3", {
        opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)",
        onStart: () => {
          document.getElementById("card-2").classList.remove("active");
          document.getElementById("card-3").classList.add("active");
        }
      }, 6.4);

      tl.fromTo("#sonar-3",
        { scale: 0.8, opacity: 1 },
        { scale: 2.2, opacity: 0, duration: 0.7, ease: "power2.out" },
        6.6
      );

      // 7. Full Illumination Harmony (8.5s - 10s)
      tl.to([".vertical-card"], {
        opacity: 1,
        duration: 0.5,
        onComplete: () => {
          document.querySelectorAll(".vertical-card").forEach(c => c.classList.add("active"));
        }
      }, 8.5);
    });
  </script>
</body>
</html>
