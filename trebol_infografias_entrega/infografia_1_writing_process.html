<!DOCTYPE html>
<html lang="es" data-fps="30" data-duration="10" data-width="1920" data-height="1080">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>El Proceso Editorial // 2026 Bento Grid (Stepped 2+3)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg-canvas: #F8FAFC;
      --card-bg: #FFFFFF;
      --card-border: #E2E8F0;
      --card-border-active: #CBD5E1;
      
      --title-dark: #0F172A;
      --text-muted: #64748B;
      
      /* 2026 Soft Pastel Badges & Primary Accents */
      --cobalt: #0284C7;
      --cobalt-pastel: #E0F2FE;
      --cobalt-border: rgba(2, 132, 199, 0.22);
      
      --violet: #7C3AED;
      --violet-pastel: #EDE9FE;
      --violet-border: rgba(124, 58, 237, 0.22);
      
      --emerald: #059669;
      --emerald-pastel: #D1FAE5;
      --emerald-border: rgba(5, 150, 105, 0.22);
      
      --shadow-ambient: 0 10px 30px -4px rgba(15, 23, 42, 0.04), 0 4px 12px -2px rgba(15, 23, 42, 0.02);
      --shadow-active: 0 24px 48px -12px rgba(15, 23, 42, 0.09), 0 8px 16px -4px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #stage-scaler {
      position: absolute;
      width: 1920px;
      height: 1080px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      background: #F8FAFC;
      overflow: hidden;
    }

    /* Subtle architectural grid pattern - Apple Keynote & Notion UI aesthetic */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.5;
      pointer-events: none;
    }

    /* TOP EDITORIAL HEADER */
    .header-bar {
      position: absolute;
      top: 60px;
      left: 120px;
      right: 120px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .header-bar h1 {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--title-dark);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--cobalt-pastel);
      border: 1px solid var(--cobalt-border);
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--cobalt);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-badge .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cobalt);
    }

    /* BENTO GRID CONTAINER (STEPPED 2 + 3) */
    .bento-container {
      position: absolute;
      top: 165px;
      left: 120px;
      width: 1680px;
      height: 680px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      z-index: 10;
    }

    /* ROW 1: 2 WIDE CARDS */
    .row-top {
      width: 100%;
      height: 324px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      position: relative;
    }

    /* ROW 2: 3 EQUAL CARDS */
    .row-bottom {
      width: 100%;
      height: 324px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 32px;
      position: relative;
    }

    /* PURE WHITE ROUNDED BENTO CARD */
    .bento-card {
      background: var(--card-bg);
      border-radius: 28px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-ambient);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px;
      opacity: 0;
      transform: translateY(24px);
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .bento-card.active {
      border-color: var(--card-border-active);
      box-shadow: var(--shadow-active);
    }

    /* SOFT PASTEL ROUNDED BADGE */
    .badge-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-badge {
      width: 100px;
      height: 100px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .icon-badge svg {
      width: 48px;
      height: 48px;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* BADGE COLOR VARIANTS */
    .badge-cobalt {
      background: var(--cobalt-pastel);
      border: 1px solid var(--cobalt-border);
      color: var(--cobalt);
    }
    .badge-cobalt svg { stroke: var(--cobalt); }

    .badge-violet {
      background: var(--violet-pastel);
      border: 1px solid var(--violet-border);
      color: var(--violet);
    }
    .badge-violet svg { stroke: var(--violet); }

    .badge-emerald {
      background: var(--emerald-pastel);
      border: 1px solid var(--emerald-border);
      color: var(--emerald);
    }
    .badge-emerald svg { stroke: var(--emerald); }

    /* SOFT PASTEL PULSE SHOCKWAVE */
    .pulse-ring {
      position: absolute;
      inset: -14px;
      border-radius: 36px;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    .ring-cobalt { border: 2px solid var(--cobalt); }
    .ring-violet { border: 2px solid var(--violet); }
    .ring-emerald { border: 2px solid var(--emerald); }

    /* BIG BOLD DARK SLATE TITLE */
    .card-title {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--title-dark);
      text-transform: uppercase;
      line-height: 1;
      text-align: center;
    }

    .row-bottom .card-title {
      font-size: 32px;
    }

    /* SHARP GEOMETRIC VECTOR CONDUITS */
    #connecting-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .vector-track {
      fill: none;
      stroke: #E2E8F0;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 6 6;
    }

    .vector-active {
      fill: none;
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .vector-packet {
      opacity: 0;
    }

    /* MINIMALIST EDITORIAL PROGRESS BAR */
    .editorial-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #E2E8F0;
      z-index: 50;
    }

    .editorial-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cobalt), var(--violet), var(--emerald));
    }
  </style>
</head>
<body>

  <div id="stage-scaler" class="clip" data-composition-id="writing_process" data-width="1920" data-height="1080" data-duration="10" data-start="0">
    <!-- Subtle Architectural Grid -->
    <div class="bg-grid"></div>

    <!-- Editorial Header -->
    <header class="header-bar" id="header-bar">
      <h1>El Proceso Editorial</h1>
      <div class="header-badge">
        <div class="badge-dot"></div>
        2026 Stepped Bento Grid (2+3)
      </div>
    </header>

    <!-- Bento Grid Container -->
    <div class="bento-container">

      <!-- Sharp Geometric Vector Lines (Stepped Conduit) -->
      <svg id="connecting-svg" viewBox="0 0 1680 680">
        <!-- 1 to 2 (Horizontal in Row 1: X=824 to X=856 at Y=162) -->
        <path class="vector-track" d="M 824 162 L 856 162" />
        <path id="vector-1" class="vector-active" stroke="var(--cobalt)" d="M 824 162 L 856 162" />
        <circle id="pkt-1" class="vector-packet" r="5" fill="var(--cobalt)" />

        <!-- 2 to 3 (Stepped Conduit: exits Card 2 bottom at X=1268, steps across gap to Card 3 top at X=269) -->
        <path class="vector-track" d="M 1268 324 L 1268 340 L 269 340 L 269 356" />
        <path id="vector-2" class="vector-active" stroke="var(--violet)" d="M 1268 324 L 1268 340 L 269 340 L 269 356" />
        <circle id="pkt-2" class="vector-packet" r="5" fill="var(--violet)" />

        <!-- 3 to 4 (Horizontal in Row 2: X=538 to X=570 at Y=518) -->
        <path class="vector-track" d="M 538 518 L 570 518" />
        <path id="vector-3" class="vector-active" stroke="var(--cobalt)" d="M 538 518 L 570 518" />
        <circle id="pkt-3" class="vector-packet" r="5" fill="var(--cobalt)" />

        <!-- 4 to 5 (Horizontal in Row 2: X=1110 to X=1142 at Y=518) -->
        <path class="vector-track" d="M 1110 518 L 1142 518" />
        <path id="vector-4" class="vector-active" stroke="var(--emerald)" d="M 1110 518 L 1142 518" />
        <circle id="pkt-4" class="vector-packet" r="5" fill="var(--emerald)" />
      </svg>

      <!-- ROW 1 (TOP: 2 WIDE CARDS) -->
      <div class="row-top">

        <!-- CARD 1: INVESTIGACIÓN (Cobalt Blue Accent) -->
        <div class="bento-card" id="card-1">
          <div class="badge-wrap">
            <div class="pulse-ring ring-cobalt" id="pulse-1"></div>
            <div class="icon-badge badge-cobalt">
              <!-- Lucide: Search / Exploration -->
              <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
          </div>
          <h2 class="card-title">INVESTIGACIÓN</h2>
        </div>

        <!-- CARD 2: REDACCIÓN (Indigo Violet Accent) -->
        <div class="bento-card" id="card-2">
          <div class="badge-wrap">
            <div class="pulse-ring ring-violet" id="pulse-2"></div>
            <div class="icon-badge badge-violet">
              <!-- Lucide: PenTool / Edit -->
              <svg viewBox="0 0 24 24">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
            </div>
          </div>
          <h2 class="card-title">REDACCIÓN</h2>
        </div>

      </div>

      <!-- ROW 2 (BOTTOM: 3 EQUAL CARDS) -->
      <div class="row-bottom">

        <!-- CARD 3: REVISIÓN (Cobalt Blue Accent) -->
        <div class="bento-card" id="card-3">
          <div class="badge-wrap">
            <div class="pulse-ring ring-cobalt" id="pulse-3"></div>
            <div class="icon-badge badge-cobalt">
              <!-- Lucide: CheckSquare / Review -->
              <svg viewBox="0 0 24 24">
                <polyline points="9 11 12 14 22 4"></polyline>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
              </svg>
            </div>
          </div>
          <h2 class="card-title">REVISIÓN</h2>
        </div>

        <!-- CARD 4: EDICIÓN (Indigo Violet Accent) -->
        <div class="bento-card" id="card-4">
          <div class="badge-wrap">
            <div class="pulse-ring ring-violet" id="pulse-4"></div>
            <div class="icon-badge badge-violet">
              <!-- Lucide: Sliders / Precise Tuning -->
              <svg viewBox="0 0 24 24">
                <line x1="4" y1="21" x2="4" y2="14"></line>
                <line x1="4" y1="10" x2="4" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12" y2="3"></line>
                <line x1="20" y1="21" x2="20" y2="16"></line>
                <line x1="20" y1="12" x2="20" y2="3"></line>
                <line x1="1" y1="14" x2="7" y2="14"></line>
                <line x1="9" y1="8" x2="15" y2="8"></line>
                <line x1="17" y1="16" x2="23" y2="16"></line>
              </svg>
            </div>
          </div>
          <h2 class="card-title">EDICIÓN</h2>
        </div>

        <!-- CARD 5: PUBLICACIÓN (Emerald Accent) -->
        <div class="bento-card" id="card-5">
          <div class="badge-wrap">
            <div class="pulse-ring ring-emerald" id="pulse-5"></div>
            <div class="icon-badge badge-emerald">
              <!-- Lucide: Send / Publish -->
              <svg viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </div>
          </div>
          <h2 class="card-title">PUBLICACIÓN</h2>
        </div>

      </div>

    </div>

    <!-- Editorial Bottom Progress Bar -->
    <div class="editorial-progress">
      <div class="editorial-fill" id="progress-fill"></div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Scale stage to fit viewport
      function handleResize() {
        const stage = document.getElementById("stage-scaler");
        const scaleX = window.innerWidth / 1920;
        const scaleY = window.innerHeight / 1080;
        const scale = Math.min(scaleX, scaleY);
        stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
      window.addEventListener('resize', handleResize);
      handleResize();

      // Master HyperFrames GSAP Timeline (10.0s strict)
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["writing_process"] = tl;

      // Bottom progress bar
      tl.to("#progress-fill", { width: "100%", duration: 10, ease: "none" }, 0);

      // Setup vector path dashes
      const setupVector = (id) => {
        const p = document.getElementById(id);
        if (!p) return { path: null, len: 0 };
        const len = p.getTotalLength() + 4;
        gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        return { path: p, len };
      };

      const v1 = setupVector("vector-1");
      const v2 = setupVector("vector-2");
      const v3 = setupVector("vector-3");
      const v4 = setupVector("vector-4");

      // Initial visual states
      gsap.set("#header-bar", { opacity: 0, y: -16 });
      gsap.set(".bento-card", { opacity: 0, y: 30 });

      // 1. Header Reveal (0.2s)
      tl.to("#header-bar", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);

      // 2. Card 1 Activation (0.6s)
      tl.to("#card-1", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)",
        onStart: () => document.getElementById("card-1").classList.add("active")
      }, 0.6);
      tl.fromTo("#pulse-1", { scale: 0.85, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.8);

      // Vector 1 -> 2 (1.8s)
      tl.to(v1.path, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 1.8);
      tl.set("#pkt-1", { opacity: 1 }, 1.8);
      tl.to("#pkt-1", {
        duration: 0.45, ease: "power2.inOut",
        onUpdate: function() {
          const pt = v1.path.getPointAtLength(this.progress() * v1.len);
          const el = document.getElementById("pkt-1");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 1.8);
      tl.set("#pkt-1", { opacity: 0 }, 2.25);

      // 3. Card 2 Activation (2.2s)
      tl.to("#card-2", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)",
        onStart: () => {
          document.getElementById("card-1").classList.remove("active");
          document.getElementById("card-2").classList.add("active");
        }
      }, 2.2);
      tl.fromTo("#pulse-2", { scale: 0.85, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.6, ease: "power2.out" }, 2.4);

      // Vector 2 -> 3 (3.4s Stepped conduit from Row 1 to Row 2)
      tl.to(v2.path, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 3.4);
      tl.set("#pkt-2", { opacity: 1 }, 3.4);
      tl.to("#pkt-2", {
        duration: 0.55, ease: "power2.inOut",
        onUpdate: function() {
          const pt = v2.path.getPointAtLength(this.progress() * v2.len);
          const el = document.getElementById("pkt-2");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 3.4);
      tl.set("#pkt-2", { opacity: 0 }, 3.95);

      // 4. Card 3 Activation (3.8s)
      tl.to("#card-3", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)",
        onStart: () => {
          document.getElementById("card-2").classList.remove("active");
          document.getElementById("card-3").classList.add("active");
        }
      }, 3.8);
      tl.fromTo("#pulse-3", { scale: 0.85, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.6, ease: "power2.out" }, 4.0);

      // Vector 3 -> 4 (5.0s)
      tl.to(v3.path, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 5.0);
      tl.set("#pkt-3", { opacity: 1 }, 5.0);
      tl.to("#pkt-3", {
        duration: 0.45, ease: "power2.inOut",
        onUpdate: function() {
          const pt = v3.path.getPointAtLength(this.progress() * v3.len);
          const el = document.getElementById("pkt-3");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 5.0);
      tl.set("#pkt-3", { opacity: 0 }, 5.45);

      // 5. Card 4 Activation (5.4s)
      tl.to("#card-4", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)",
        onStart: () => {
          document.getElementById("card-3").classList.remove("active");
          document.getElementById("card-4").classList.add("active");
        }
      }, 5.4);
      tl.fromTo("#pulse-4", { scale: 0.85, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.6, ease: "power2.out" }, 5.6);

      // Vector 4 -> 5 (6.6s)
      tl.to(v4.path, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 6.6);
      tl.set("#pkt-4", { opacity: 1 }, 6.6);
      tl.to("#pkt-4", {
        duration: 0.45, ease: "power2.inOut",
        onUpdate: function() {
          const pt = v4.path.getPointAtLength(this.progress() * v4.len);
          const el = document.getElementById("pkt-4");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 6.6);
      tl.set("#pkt-4", { opacity: 0 }, 7.05);

      // 6. Card 5 Activation (7.0s)
      tl.to("#card-5", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)",
        onStart: () => {
          document.getElementById("card-4").classList.remove("active");
          document.getElementById("card-5").classList.add("active");
        }
      }, 7.0);
      tl.fromTo("#pulse-5", { scale: 0.85, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.6, ease: "power2.out" }, 7.2);

      // 7. Full Illumination Final Hold (8.4s - 10.0s)
      tl.to(".bento-card", {
        opacity: 1,
        y: 0,
        duration: 0.5,
        onStart: () => {
          document.querySelectorAll(".bento-card").forEach(c => c.classList.add("active"));
        }
      }, 8.4);

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') tl.paused(!tl.paused());
        if (e.code === 'KeyR') tl.restart();
      });

      // Play
      tl.play();
    });
  </script>
</body>
</html>
