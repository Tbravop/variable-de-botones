<!DOCTYPE html>
<html lang="es" data-fps="30" data-duration="10" data-width="1920" data-height="1080">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Funnel de Conversión // 2026 Bento Grid (Sequential 4-Flow)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg-canvas: #F8FAFC;
      --card-bg: #FFFFFF;
      --card-border: #E2E8F0;
      --card-border-active: #CBD5E1;
      
      --title-dark: #0F172A;
      --text-muted: #64748B;
      
      /* 2026 Soft Pastel Badges & Primary Accents */
      --cobalt: #0284C7;
      --cobalt-pastel: #E0F2FE;
      --cobalt-border: rgba(2, 132, 199, 0.22);
      
      --violet: #7C3AED;
      --violet-pastel: #EDE9FE;
      --violet-border: rgba(124, 58, 237, 0.22);
      
      --emerald: #059669;
      --emerald-pastel: #D1FAE5;
      --emerald-border: rgba(5, 150, 105, 0.22);
      
      --shadow-ambient: 0 10px 30px -4px rgba(15, 23, 42, 0.04), 0 4px 12px -2px rgba(15, 23, 42, 0.02);
      --shadow-active: 0 24px 48px -12px rgba(15, 23, 42, 0.09), 0 8px 16px -4px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #stage-scaler {
      position: absolute;
      width: 1920px;
      height: 1080px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      background: #F8FAFC;
      overflow: hidden;
    }

    /* Subtle architectural grid pattern - Apple Keynote & Notion UI aesthetic */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.5;
      pointer-events: none;
    }

    /* TOP EDITORIAL HEADER */
    .header-bar {
      position: absolute;
      top: 65px;
      left: 120px;
      right: 120px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .header-bar h1 {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--title-dark);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--emerald-pastel);
      border: 1px solid var(--emerald-border);
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--emerald);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-badge .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
    }

    /* BENTO GRID CANVAS: 4 STAGES ROW */
    .bento-container {
      position: absolute;
      top: 185px;
      left: 120px;
      width: 1680px;
      height: 600px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 36px;
      z-index: 10;
    }

    /* PURE WHITE ROUNDED VERTICAL CARD */
    .bento-card {
      background: var(--card-bg);
      border-radius: 30px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-ambient);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 50px 30px;
      opacity: 0;
      transform: translateY(28px);
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .bento-card.active {
      border-color: var(--card-border-active);
      box-shadow: var(--shadow-active);
    }

    /* SOFT PASTEL ROUNDED BADGE */
    .badge-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-badge {
      width: 104px;
      height: 104px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .icon-badge svg {
      width: 50px;
      height: 50px;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* BADGE COLOR ACCENTS */
    .badge-cobalt {
      background: var(--cobalt-pastel);
      border: 1px solid var(--cobalt-border);
      color: var(--cobalt);
    }
    .badge-cobalt svg { stroke: var(--cobalt); }

    .badge-violet {
      background: var(--violet-pastel);
      border: 1px solid var(--violet-border);
      color: var(--violet);
    }
    .badge-violet svg { stroke: var(--violet); }

    .badge-emerald {
      background: var(--emerald-pastel);
      border: 1px solid var(--emerald-border);
      color: var(--emerald);
    }
    .badge-emerald svg { stroke: var(--emerald); }

    /* SOFT PASTEL PULSE SHOCKWAVE */
    .pulse-ring {
      position: absolute;
      inset: -15px;
      border-radius: 40px;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    .ring-cobalt { border: 2px solid var(--cobalt); }
    .ring-violet { border: 2px solid var(--violet); }
    .ring-emerald { border: 2px solid var(--emerald); }

    /* BIG BOLD DARK SLATE TITLE */
    .card-title {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--title-dark);
      text-transform: uppercase;
      line-height: 1.1;
      text-align: center;
    }

    /* SHARP GEOMETRIC VECTOR CONDUITS */
    #connecting-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .vector-track {
      fill: none;
      stroke: #E2E8F0;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 6 6;
    }

    .vector-active {
      fill: none;
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .vector-packet {
      opacity: 0;
    }

    /* MINIMALIST EDITORIAL PROGRESS BAR */
    .editorial-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #E2E8F0;
      z-index: 50;
    }

    .editorial-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cobalt), var(--violet), var(--cobalt), var(--emerald));
    }
  </style>
</head>
<body>

  <div id="stage-scaler" class="clip" data-composition-id="funnel_marketing" data-width="1920" data-height="1080" data-duration="10" data-start="0">
    <!-- Subtle Architectural Grid -->
    <div class="bg-grid"></div>

    <!-- Editorial Header -->
    <header class="header-bar" id="header-bar">
      <h1>Funnel de Conversión</h1>
      <div class="header-badge">
        <div class="badge-dot"></div>
        2026 Sequential Bento Grid (4 Stages)
      </div>
    </header>

    <!-- Bento Grid Container (4 Stages) -->
    <div class="bento-container">

      <!-- Sharp Geometric Vector Lines (Horizontal Flow: 1 -> 2 -> 3 -> 4) -->
      <svg id="connecting-svg" viewBox="0 0 1680 600">
        <!-- 1 to 2 (Horizontal: X=393 to X=429 at Y=300) -->
        <path class="vector-track" d="M 393 300 L 429 300" />
        <path id="vector-1" class="vector-active" stroke="var(--cobalt)" d="M 393 300 L 429 300" />
        <circle id="pkt-1" class="vector-packet" r="5" fill="var(--cobalt)" />

        <!-- 2 to 3 (Horizontal: X=822 to X=858 at Y=300) -->
        <path class="vector-track" d="M 822 300 L 858 300" />
        <path id="vector-2" class="vector-active" stroke="var(--violet)" d="M 822 300 L 858 300" />
        <circle id="pkt-2" class="vector-packet" r="5" fill="var(--violet)" />

        <!-- 3 to 4 (Horizontal: X=1251 to X=1287 at Y=300) -->
        <path class="vector-track" d="M 1251 300 L 1287 300" />
        <path id="vector-3" class="vector-active" stroke="var(--emerald)" d="M 1251 300 L 1287 300" />
        <circle id="pkt-3" class="vector-packet" r="5" fill="var(--emerald)" />
      </svg>

      <!-- STAGE 1: ATRACCIÓN (Cobalt Blue Accent) -->
      <div class="bento-card" id="card-1">
        <div class="badge-wrap">
          <div class="pulse-ring ring-cobalt" id="pulse-1"></div>
          <div class="icon-badge badge-cobalt">
            <!-- Lucide: Users / Audience Attraction -->
            <svg viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
        </div>
        <h2 class="card-title">ATRACCIÓN</h2>
      </div>

      <!-- STAGE 2: INTERÉS (Indigo Violet Accent) -->
      <div class="bento-card" id="card-2">
        <div class="badge-wrap">
          <div class="pulse-ring ring-violet" id="pulse-2"></div>
          <div class="icon-badge badge-violet">
            <!-- Lucide: Filter / Engagement Qualification -->
            <svg viewBox="0 0 24 24">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
          </div>
        </div>
        <h2 class="card-title">INTERÉS</h2>
      </div>

      <!-- STAGE 3: DECISIÓN (Cobalt Blue Accent) -->
      <div class="bento-card" id="card-3">
        <div class="badge-wrap">
          <div class="pulse-ring ring-cobalt" id="pulse-3"></div>
          <div class="icon-badge badge-cobalt">
            <!-- Lucide: Target / Decision Making -->
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="6"></circle>
              <circle cx="12" cy="12" r="2"></circle>
            </svg>
          </div>
        </div>
        <h2 class="card-title">DECISIÓN</h2>
      </div>

      <!-- STAGE 4: CONVERSIÓN (Emerald Accent) -->
      <div class="bento-card" id="card-4">
        <div class="badge-wrap">
          <div class="pulse-ring ring-emerald" id="pulse-4"></div>
          <div class="icon-badge badge-emerald">
            <!-- Lucide: Trophy / Conversion & Value Realization -->
            <svg viewBox="0 0 24 24">
              <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
              <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
              <path d="M4 22h16"></path>
              <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
              <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
              <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
            </svg>
          </div>
        </div>
        <h2 class="card-title">CONVERSIÓN</h2>
      </div>

    </div>

    <!-- Editorial Bottom Progress Bar -->
    <div class="editorial-progress">
      <div class="editorial-fill" id="progress-fill"></div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Scale stage to fit viewport
      function handleResize() {
        const stage = document.getElementById("stage-scaler");
        const scaleX = window.innerWidth / 1920;
        const scaleY = window.innerHeight / 1080;
        const scale = Math.min(scaleX, scaleY);
        stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
      window.addEventListener('resize', handleResize);
      handleResize();

      // Master HyperFrames GSAP Timeline (10.0s strict)
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["funnel_marketing"] = tl;

      // Bottom progress bar
      tl.to("#progress-fill", { width: "100%", duration: 10, ease: "none" }, 0);

      // Setup vector path dashes
      const setupVector = (id) => {
        const p = document.getElementById(id);
        if (!p) return { path: null, len: 0 };
        const len = p.getTotalLength() + 4;
        gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        return { path: p, len };
      };

      const v1 = setupVector("vector-1");
      const v2 = setupVector("vector-2");
      const v3 = setupVector("vector-3");

      // Initial visual states
      gsap.set("#header-bar", { opacity: 0, y: -16 });
      gsap.set(".bento-card", { opacity: 0, y: 30 });

      // 1. Header Reveal (0.2s)
      tl.to("#header-bar", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);

      // 2. Stage 1 (Atracción) Activation (0.6s)
      tl.to("#card-1", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)",
        onStart: () => document.getElementById("card-1").classList.add("active")
      }, 0.6);
      tl.fromTo("#pulse-1", { scale: 0.85, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.8);

      // Vector 1 -> 2 Stream (2.2s)
      tl.to(v1.path, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 2.2);
      tl.set("#pkt-1", { opacity: 1 }, 2.2);
      tl.to("#pkt-1", {
        duration: 0.5, ease: "power2.inOut",
        onUpdate: function() {
          const pt = v1.path.getPointAtLength(this.progress() * v1.len);
          const el = document.getElementById("pkt-1");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 2.2);
      tl.set("#pkt-1", { opacity: 0 }, 2.7);

      // 3. Stage 2 (Interés) Activation (2.7s)
      tl.to("#card-2", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)",
        onStart: () => {
          document.getElementById("card-1").classList.remove("active");
          document.getElementById("card-2").classList.add("active");
        }
      }, 2.7);
      tl.fromTo("#pulse-2", { scale: 0.85, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.6, ease: "power2.out" }, 2.9);

      // Vector 2 -> 3 Stream (4.4s)
      tl.to(v2.path, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 4.4);
      tl.set("#pkt-2", { opacity: 1 }, 4.4);
      tl.to("#pkt-2", {
        duration: 0.5, ease: "power2.inOut",
        onUpdate: function() {
          const pt = v2.path.getPointAtLength(this.progress() * v2.len);
          const el = document.getElementById("pkt-2");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 4.4);
      tl.set("#pkt-2", { opacity: 0 }, 4.9);

      // 4. Stage 3 (Decisión) Activation (4.9s)
      tl.to("#card-3", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)",
        onStart: () => {
          document.getElementById("card-2").classList.remove("active");
          document.getElementById("card-3").classList.add("active");
        }
      }, 4.9);
      tl.fromTo("#pulse-3", { scale: 0.85, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.6, ease: "power2.out" }, 5.1);

      // Vector 3 -> 4 Stream (6.5s)
      tl.to(v3.path, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 6.5);
      tl.set("#pkt-3", { opacity: 1 }, 6.5);
      tl.to("#pkt-3", {
        duration: 0.5, ease: "power2.inOut",
        onUpdate: function() {
          const pt = v3.path.getPointAtLength(this.progress() * v3.len);
          const el = document.getElementById("pkt-3");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 6.5);
      tl.set("#pkt-3", { opacity: 0 }, 7.0);

      // 5. Stage 4 (Conversión) Activation (7.0s)
      tl.to("#card-4", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)",
        onStart: () => {
          document.getElementById("card-3").classList.remove("active");
          document.getElementById("card-4").classList.add("active");
        }
      }, 7.0);
      tl.fromTo("#pulse-4", { scale: 0.85, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.6, ease: "power2.out" }, 7.2);

      // 6. Full Illumination Final State Hold (8.4s - 10.0s)
      tl.to(".bento-card", {
        opacity: 1,
        y: 0,
        duration: 0.5,
        onStart: () => {
          document.querySelectorAll(".bento-card").forEach(c => c.classList.add("active"));
        }
      }, 8.4);

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') tl.paused(!tl.paused());
        if (e.code === 'KeyR') tl.restart();
      });

      // Play
      tl.play();
    });
  </script>
</body>
</html>
