<!DOCTYPE html>
<html lang="es" data-fps="30" data-duration="10" data-width="1920" data-height="1080">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Infografía 04: Funnel de Marketing & Ventas // Minimalist Bento Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800;900&family=Montserrat:wght@800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg-midnight: #0B0F19;
      --card-bg: rgba(19, 26, 42, 0.94);
      --card-border: #232E47;
      
      --cyan: #38BDF8;
      --cyan-glow: rgba(56, 189, 248, 0.45);
      
      --purple: #A855F7;
      --purple-glow: rgba(168, 85, 247, 0.45);
      
      --amber: #F59E0B;
      --amber-glow: rgba(245, 158, 11, 0.45);
      
      --emerald: #10B981;
      --emerald-glow: rgba(16, 185, 129, 0.5);
      
      --text-white: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-midnight);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
    }

    #stage-scaler {
      position: absolute;
      width: 1920px;
      height: 1080px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      background: radial-gradient(circle at 50% 25%, #151F38 0%, #0B0F19 65%, #060911 100%);
      overflow: hidden;
      box-shadow: 0 0 120px rgba(0, 0, 0, 0.95);
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .bento-container {
      position: absolute;
      top: 60px;
      left: 90px;
      right: 90px;
      height: 720px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      z-index: 10;
    }

    .bento-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1.5px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* TOP WIDE BANNER CARD */
    .banner-card {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 50px;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
    }

    .banner-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--text-white);
      text-transform: uppercase;
      line-height: 1;
    }

    .banner-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: rgba(16, 185, 129, 0.12);
      border: 1.5px solid var(--emerald);
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 800;
      color: var(--emerald);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 0 0 20px var(--emerald-glow);
    }

    .banner-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
    }

    /* 4 EQUAL VERTICAL BENTO CARDS */
    .cards-row-4 {
      width: 100%;
      height: 568px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
      position: relative;
    }

    .vertical-card {
      height: 100%;
      padding: 42px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      opacity: 0;
      transform: translateY(35px);
    }

    .card-accent-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 900;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .icon-hero-box {
      width: 116px;
      height: 116px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 18px 0;
      transition: all 0.4s ease;
    }

    .icon-hero-box svg {
      width: 60px;
      height: 60px;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .sonar-ring {
      position: absolute;
      inset: -10px;
      border-radius: 36px;
      opacity: 0;
      pointer-events: none;
    }

    .card-hero-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--text-white);
      text-transform: uppercase;
      line-height: 1.15;
    }

    .card-visual-plate {
      width: 100%;
      height: 110px;
      border-radius: 14px;
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-visual-plate svg {
      width: 62px;
      height: 62px;
      fill: none;
      stroke-width: 1.8;
    }

    /* CARD COLORS */
    /* Card 1: Cyan #38BDF8 // CAPTACIÓN */
    .card-f1 { border-top: 3px solid var(--cyan); }
    .card-f1 .card-accent-pill { color: var(--cyan); border-color: rgba(56,189,248,0.35); background: rgba(56,189,248,0.1); }
    .card-f1 .icon-hero-box { background: rgba(56,189,248,0.1); border: 2px solid var(--cyan); color: var(--cyan); box-shadow: 0 0 30px var(--cyan-glow); }
    .card-f1 .card-visual-plate svg { stroke: var(--cyan); filter: drop-shadow(0 0 8px var(--cyan-glow)); }
    .card-f1.active { border-color: var(--cyan); box-shadow: 0 20px 50px rgba(56,189,248,0.25); transform: translateY(-8px); }

    /* Card 2: Purple #A855F7 // LEAD MAGNET */
    .card-f2 { border-top: 3px solid var(--purple); }
    .card-f2 .card-accent-pill { color: var(--purple); border-color: rgba(168,85,247,0.35); background: rgba(168,85,247,0.1); }
    .card-f2 .icon-hero-box { background: rgba(168,85,247,0.1); border: 2px solid var(--purple); color: var(--purple); box-shadow: 0 0 30px var(--purple-glow); }
    .card-f2 .card-visual-plate svg { stroke: var(--purple); filter: drop-shadow(0 0 8px var(--purple-glow)); }
    .card-f2.active { border-color: var(--purple); box-shadow: 0 20px 50px rgba(168,85,247,0.25); transform: translateY(-8px); }

    /* Card 3: Amber #F59E0B // EMAIL FLOW */
    .card-f3 { border-top: 3px solid var(--amber); }
    .card-f3 .card-accent-pill { color: var(--amber); border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.1); }
    .card-f3 .icon-hero-box { background: rgba(245,158,11,0.1); border: 2px solid var(--amber); color: var(--amber); box-shadow: 0 0 30px var(--amber-glow); }
    .card-f3 .card-visual-plate svg { stroke: var(--amber); filter: drop-shadow(0 0 8px var(--amber-glow)); }
    .card-f3.active { border-color: var(--amber); box-shadow: 0 20px 50px rgba(245,158,11,0.25); transform: translateY(-8px); }

    /* Card 4: Emerald #10B981 // HERO GOAL VENTA FINAL */
    .card-f4 { border: 2.5px solid var(--emerald); box-shadow: 0 16px 50px rgba(16,185,129,0.25); }
    .card-f4 .card-accent-pill { background: var(--emerald); color: #000; font-weight: 900; border-color: var(--emerald); }
    .card-f4 .icon-hero-box { background: linear-gradient(135deg, rgba(16,185,129,0.35), rgba(11,15,25,0.9)); border: 2px solid var(--emerald); color: var(--emerald); box-shadow: 0 0 40px var(--emerald-glow); }
    .card-f4 .card-hero-title { color: var(--emerald); text-shadow: 0 0 20px var(--emerald-glow); }
    .card-f4 .card-visual-plate svg { stroke: var(--emerald); filter: drop-shadow(0 0 10px var(--emerald-glow)); }
    .card-f4.active { box-shadow: 0 25px 70px rgba(16,185,129,0.4); transform: translateY(-8px) scale(1.02); }

    /* CONNECTING LASER BEAMS */
    #connecting-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
    }

    .laser-wire {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-dasharray: 6 6;
    }

    .laser-active {
      fill: none;
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-dashoffset: 450;
    }

    .laser-packet {
      fill: #FFFFFF;
      opacity: 0;
    }

    .tv-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 50;
    }

    .tv-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--amber), var(--emerald));
      box-shadow: 0 0 15px var(--emerald);
    }
  </style>
</head>
<body>

  <div id="stage-scaler" data-composition-id="marketing_funnel" data-width="1920" data-height="1080" data-duration="10">
    <div class="bg-grid"></div>

    <div class="bento-container">

      <!-- TOP WIDE BANNER CARD -->
      <div class="bento-card banner-card" id="banner-card">
        <h1 class="banner-title">EMBUDO DE CONVERSIÓN &amp; VENTAS</h1>
        <div class="banner-badge">
          <div class="dot"></div>
          2026 GROWTH PIPELINE
        </div>
      </div>

      <!-- 4 EQUAL VERTICAL BENTO CARDS -->
      <div class="cards-row-4">

        <!-- Laser Beams SVG between cards -->
        <svg id="connecting-svg" viewBox="0 0 1740 568">
          <!-- 1 to 2 -->
          <path class="laser-wire" d="M 414 284 L 442 284" />
          <path id="laser-1" class="laser-active" stroke="var(--cyan)" d="M 414 284 L 442 284" filter="drop-shadow(0 0 8px var(--cyan))" />
          <circle id="pkt-1" class="laser-packet" r="6" filter="drop-shadow(0 0 10px var(--cyan))" />

          <!-- 2 to 3 -->
          <path class="laser-wire" d="M 856 284 L 884 284" />
          <path id="laser-2" class="laser-active" stroke="var(--purple)" d="M 856 284 L 884 284" filter="drop-shadow(0 0 8px var(--purple))" />
          <circle id="pkt-2" class="laser-packet" r="6" filter="drop-shadow(0 0 10px var(--purple))" />

          <!-- 3 to 4 -->
          <path class="laser-wire" d="M 1298 284 L 1326 284" />
          <path id="laser-3" class="laser-active" stroke="var(--amber)" d="M 1298 284 L 1326 284" filter="drop-shadow(0 0 8px var(--amber))" />
          <circle id="pkt-3" class="laser-packet" r="6" filter="drop-shadow(0 0 10px var(--amber))" />
        </svg>

        <!-- CARD 1: 01 CAPTACIÓN -->
        <div class="bento-card vertical-card card-f1" id="card-1">
          <div class="card-accent-pill">ETAPA 01</div>
          
          <div class="icon-hero-box">
            <!-- Target / Magnet SVG -->
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="6"/>
              <circle cx="12" cy="12" r="2"/>
            </svg>
            <div class="sonar-ring" id="sonar-1" style="border: 2px solid var(--cyan);"></div>
          </div>

          <h2 class="card-hero-title">01 CAPTACIÓN</h2>

          <!-- Clean Browser Landing Plate -->
          <div class="card-visual-plate">
            <svg viewBox="0 0 24 24">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
        </div>

        <!-- CARD 2: 02 LEAD MAGNET -->
        <div class="bento-card vertical-card card-f2" id="card-2">
          <div class="card-accent-pill">ETAPA 02</div>

          <div class="icon-hero-box">
            <!-- Gift / Value SVG -->
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <polyline points="20 12 20 22 4 22 4 12"/>
              <rect x="2" y="7" width="20" height="5"/>
              <line x1="12" y1="22" x2="12" y2="7"/>
              <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
              <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
            </svg>
            <div class="sonar-ring" id="sonar-2" style="border: 2px solid var(--purple);"></div>
          </div>

          <h2 class="card-hero-title">02 LEAD MAGNET</h2>

          <!-- Clean Delivery Check Plate -->
          <div class="card-visual-plate">
            <svg viewBox="0 0 24 24">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
        </div>

        <!-- CARD 3: 03 EMAIL FLOW -->
        <div class="bento-card vertical-card card-f3" id="card-3">
          <div class="card-accent-pill">ETAPA 03</div>

          <div class="icon-hero-box">
            <!-- Automated Email Nurture SVG -->
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <div class="sonar-ring" id="sonar-3" style="border: 2px solid var(--amber);"></div>
          </div>

          <h2 class="card-hero-title">03 EMAIL FLOW</h2>

          <!-- Clean Loop Trajectory Plate -->
          <div class="card-visual-plate">
            <svg viewBox="0 0 24 24">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
          </div>
        </div>

        <!-- CARD 4: 04 VENTA FINAL -->
        <div class="bento-card vertical-card card-f4" id="card-4">
          <div class="card-accent-pill">OBJETIVO FINAL</div>

          <div class="icon-hero-box">
            <!-- Calendar Consult / Direct Call SVG -->
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            <div class="sonar-ring" id="sonar-4" style="border: 2px solid var(--emerald);"></div>
          </div>

          <h2 class="card-hero-title">04 VENTA FINAL</h2>

          <!-- Clean Verified Deal Plate -->
          <div class="card-visual-plate">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
        </div>

      </div>

    </div>

    <!-- TV PROGRESS BAR -->
    <div class="tv-progress-track">
      <div class="tv-progress-fill" id="progress-bar"></div>
    </div>
  </div>

  <script>
    function updateScale() {
      const scaler = document.getElementById('stage-scaler');
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY);
      scaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', updateScale);
    updateScale();

    window.addEventListener('DOMContentLoaded', () => {
      const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.5 });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') tl.paused(!tl.paused());
        if (e.code === 'KeyR') tl.restart();
      });

      tl.to("#progress-bar", { width: "100%", duration: 10, ease: "none" }, 0);

      const p1 = document.getElementById("laser-1");
      const len1 = p1.getTotalLength() + 5;
      gsap.set(p1, { strokeDasharray: len1, strokeDashoffset: len1 });

      const p2 = document.getElementById("laser-2");
      const len2 = p2.getTotalLength() + 5;
      gsap.set(p2, { strokeDasharray: len2, strokeDashoffset: len2 });

      const p3 = document.getElementById("laser-3");
      const len3 = p3.getTotalLength() + 5;
      gsap.set(p3, { strokeDasharray: len3, strokeDashoffset: len3 });

      gsap.set("#banner-card", { opacity: 0, y: -20 });
      gsap.set([".vertical-card"], { opacity: 0, y: 35 });

      // 1. Banner (0.2s)
      tl.to("#banner-card", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);

      // 2. Card 1 (0.8s)
      tl.to("#card-1", {
        opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)",
        onStart: () => document.getElementById("card-1").classList.add("active")
      }, 0.8);
      tl.fromTo("#sonar-1", { scale: 0.8, opacity: 1 }, { scale: 2.2, opacity: 0, duration: 0.7, ease: "power2.out" }, 1.0);

      // Stream 1 to 2 (2.2s)
      tl.to(p1, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 2.2);
      tl.set("#pkt-1", { opacity: 1 }, 2.2);
      tl.to("#pkt-1", {
        duration: 0.6, ease: "power2.inOut",
        onUpdate: function() {
          const pt = p1.getPointAtLength(this.progress() * len1);
          const el = document.getElementById("pkt-1");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 2.2);
      tl.set("#pkt-1", { opacity: 0 }, 2.8);

      // 3. Card 2 (2.8s)
      tl.to("#card-2", {
        opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)",
        onStart: () => {
          document.getElementById("card-1").classList.remove("active");
          document.getElementById("card-2").classList.add("active");
        }
      }, 2.8);
      tl.fromTo("#sonar-2", { scale: 0.8, opacity: 1 }, { scale: 2.2, opacity: 0, duration: 0.7, ease: "power2.out" }, 3.0);

      // Stream 2 to 3 (4.4s)
      tl.to(p2, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 4.4);
      tl.set("#pkt-2", { opacity: 1 }, 4.4);
      tl.to("#pkt-2", {
        duration: 0.6, ease: "power2.inOut",
        onUpdate: function() {
          const pt = p2.getPointAtLength(this.progress() * len2);
          const el = document.getElementById("pkt-2");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 4.4);
      tl.set("#pkt-2", { opacity: 0 }, 5.0);

      // 4. Card 3 (5.0s)
      tl.to("#card-3", {
        opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)",
        onStart: () => {
          document.getElementById("card-2").classList.remove("active");
          document.getElementById("card-3").classList.add("active");
        }
      }, 5.0);
      tl.fromTo("#sonar-3", { scale: 0.8, opacity: 1 }, { scale: 2.2, opacity: 0, duration: 0.7, ease: "power2.out" }, 5.2);

      // Stream 3 to 4 (6.6s)
      tl.to(p3, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 6.6);
      tl.set("#pkt-3", { opacity: 1 }, 6.6);
      tl.to("#pkt-3", {
        duration: 0.6, ease: "power2.inOut",
        onUpdate: function() {
          const pt = p3.getPointAtLength(this.progress() * len3);
          const el = document.getElementById("pkt-3");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 6.6);
      tl.set("#pkt-3", { opacity: 0 }, 7.2);

      // 5. Card 4 (7.2s)
      tl.to("#card-4", {
        opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)",
        onStart: () => {
          document.getElementById("card-3").classList.remove("active");
          document.getElementById("card-4").classList.add("active");
        }
      }, 7.2);
      tl.fromTo("#sonar-4", { scale: 0.8, opacity: 1 }, { scale: 2.3, opacity: 0, duration: 0.7, ease: "power2.out" }, 7.4);

      // 6. Full Illumination Harmony (8.6s - 10s)
      tl.to([".vertical-card"], {
        opacity: 1,
        duration: 0.5,
        onComplete: () => {
          document.querySelectorAll(".vertical-card").forEach(c => c.classList.add("active"));
        }
      }, 8.6);
    });
  </script>
</body>
</html>
