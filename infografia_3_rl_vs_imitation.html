<!DOCTYPE html>
<html lang="es" data-fps="30" data-duration="10" data-width="1920" data-height="1080">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Refuerzo vs. Imitación // 2026 Bento Grid (Convergent Center Hero)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg-canvas: #F8FAFC;
      --card-bg: #FFFFFF;
      --card-border: #E2E8F0;
      --card-border-active: #CBD5E1;
      
      --title-dark: #0F172A;
      --text-muted: #64748B;
      
      /* 2026 Soft Pastel Badges & Primary Accents */
      --cobalt: #0284C7;
      --cobalt-pastel: #E0F2FE;
      --cobalt-border: rgba(2, 132, 199, 0.22);
      
      --violet: #7C3AED;
      --violet-pastel: #EDE9FE;
      --violet-border: rgba(124, 58, 237, 0.22);
      
      --emerald: #059669;
      --emerald-pastel: #D1FAE5;
      --emerald-border: rgba(5, 150, 105, 0.22);
      
      --shadow-ambient: 0 10px 30px -4px rgba(15, 23, 42, 0.04), 0 4px 12px -2px rgba(15, 23, 42, 0.02);
      --shadow-hero: 0 20px 45px -8px rgba(15, 23, 42, 0.08), 0 8px 16px -4px rgba(15, 23, 42, 0.03);
      --shadow-active: 0 28px 56px -12px rgba(15, 23, 42, 0.12), 0 10px 20px -4px rgba(15, 23, 42, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #stage-scaler {
      position: absolute;
      width: 1920px;
      height: 1080px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      background: #F8FAFC;
      overflow: hidden;
    }

    /* Subtle architectural grid pattern - Apple Keynote & Notion UI aesthetic */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.5;
      pointer-events: none;
    }

    /* TOP EDITORIAL HEADER */
    .header-bar {
      position: absolute;
      top: 65px;
      left: 120px;
      right: 120px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .header-bar h1 {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--title-dark);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--violet-pastel);
      border: 1px solid var(--violet-border);
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--violet);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-badge .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--violet);
    }

    /* BENTO ROW: CONVERGENT CENTER HERO */
    .bento-row {
      position: absolute;
      top: 190px;
      left: 120px;
      width: 1680px;
      height: 580px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    /* PURE WHITE ROUNDED BENTO CARD */
    .bento-card {
      background: var(--card-bg);
      border-radius: 32px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-ambient);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 32px;
      padding: 48px 36px;
      opacity: 0;
      transform: translateY(28px);
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .bento-card.active {
      border-color: var(--card-border-active);
      box-shadow: var(--shadow-active);
    }

    /* OUTER SATELLITE CARDS (LEFT & RIGHT) */
    .card-satellite {
      width: 460px;
      height: 480px;
    }

    /* CENTER DOMINANT HERO CARD */
    .card-hero {
      width: 640px;
      height: 580px;
      box-shadow: var(--shadow-hero);
      z-index: 15;
      gap: 40px;
      padding: 56px 48px;
    }

    /* SOFT PASTEL ROUNDED BADGE */
    .badge-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-badge {
      width: 110px;
      height: 110px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .card-hero .icon-badge {
      width: 130px;
      height: 130px;
      border-radius: 34px;
    }

    .icon-badge svg {
      width: 52px;
      height: 52px;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .card-hero .icon-badge svg {
      width: 64px;
      height: 64px;
    }

    /* BADGE COLOR ACCENTS */
    .badge-cobalt {
      background: var(--cobalt-pastel);
      border: 1px solid var(--cobalt-border);
      color: var(--cobalt);
    }
    .badge-cobalt svg { stroke: var(--cobalt); }

    .badge-violet {
      background: var(--violet-pastel);
      border: 1px solid var(--violet-border);
      color: var(--violet);
    }
    .badge-violet svg { stroke: var(--violet); }

    .badge-emerald {
      background: var(--emerald-pastel);
      border: 1px solid var(--emerald-border);
      color: var(--emerald);
    }
    .badge-emerald svg { stroke: var(--emerald); }

    /* SOFT PASTEL PULSE SHOCKWAVE */
    .pulse-ring {
      position: absolute;
      inset: -16px;
      border-radius: 42px;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    .card-hero .pulse-ring {
      inset: -20px;
      border-radius: 50px;
    }
    .ring-cobalt { border: 2px solid var(--cobalt); }
    .ring-violet { border: 2px solid var(--violet); }
    .ring-emerald { border: 2px solid var(--emerald); }

    /* BIG BOLD DARK SLATE TITLE */
    .card-title {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--title-dark);
      text-transform: uppercase;
      line-height: 1.1;
      text-align: center;
    }

    .hero-title {
      font-size: 42px;
      letter-spacing: -0.02em;
    }

    /* SHARP GEOMETRIC CONVERGENT VECTOR CONDUITS */
    #connecting-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .vector-track {
      fill: none;
      stroke: #E2E8F0;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 6 6;
    }

    .vector-active {
      fill: none;
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .vector-packet {
      opacity: 0;
    }

    /* MINIMALIST EDITORIAL PROGRESS BAR */
    .editorial-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #E2E8F0;
      z-index: 50;
    }

    .editorial-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cobalt), var(--violet), var(--emerald));
    }
  </style>
</head>
<body>

  <div id="stage-scaler" class="clip" data-composition-id="rl_vs_imitation" data-width="1920" data-height="1080" data-duration="10" data-start="0">
    <!-- Subtle Architectural Grid -->
    <div class="bg-grid"></div>

    <!-- Editorial Header -->
    <header class="header-bar" id="header-bar">
      <h1>Aprendizaje por Refuerzo vs. Imitación</h1>
      <div class="header-badge">
        <div class="badge-dot"></div>
        2026 Convergent Center Hero
      </div>
    </header>

    <!-- Bento Row: Convergent Center Hero -->
    <div class="bento-row">

      <!-- Sharp Geometric Convergent Vector Conduits (Left -> Center & Right -> Center) -->
      <svg id="connecting-svg" viewBox="0 0 1680 580">
        <!-- Left to Center Hero (Horizontal: X=460 to X=520 at Y=290) -->
        <path class="vector-track" d="M 460 290 L 520 290" />
        <path id="vector-left" class="vector-active" stroke="var(--cobalt)" d="M 460 290 L 520 290" />
        <circle id="pkt-left" class="vector-packet" r="5" fill="var(--cobalt)" />

        <!-- Right to Center Hero (Horizontal: X=1220 to X=1160 at Y=290 - Inwards!) -->
        <path class="vector-track" d="M 1220 290 L 1160 290" />
        <path id="vector-right" class="vector-active" stroke="var(--emerald)" d="M 1220 290 L 1160 290" />
        <circle id="pkt-right" class="vector-packet" r="5" fill="var(--emerald)" />
      </svg>

      <!-- SATELLITE 1: AGENTE AUTÓNOMO (Cobalt Blue Accent) -->
      <div class="bento-card card-satellite" id="card-left">
        <div class="badge-wrap">
          <div class="pulse-ring ring-cobalt" id="pulse-left"></div>
          <div class="icon-badge badge-cobalt">
            <!-- Lucide: Zap / Autonomous Exploration -->
            <svg viewBox="0 0 24 24">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
        </div>
        <h2 class="card-title">AGENTE AUTÓNOMO</h2>
      </div>

      <!-- DOMINANT CENTER HERO: NÚCLEO DE APRENDIZAJE (Indigo Violet Accent) -->
      <div class="bento-card card-hero" id="card-center">
        <div class="badge-wrap">
          <div class="pulse-ring ring-violet" id="pulse-center"></div>
          <div class="icon-badge badge-violet">
            <!-- Lucide: Cpu / Core Neural Processor -->
            <svg viewBox="0 0 24 24">
              <rect x="4" y="4" width="16" height="16" rx="2"></rect>
              <rect x="9" y="9" width="6" height="6"></rect>
              <line x1="9" y1="1" x2="9" y2="4"></line>
              <line x1="15" y1="1" x2="15" y2="4"></line>
              <line x1="9" y1="20" x2="9" y2="23"></line>
              <line x1="15" y1="20" x2="15" y2="23"></line>
              <line x1="20" y1="9" x2="23" y2="9"></line>
              <line x1="20" y1="14" x2="23" y2="14"></line>
              <line x1="1" y1="9" x2="4" y2="9"></line>
              <line x1="1" y1="14" x2="4" y2="14"></line>
            </svg>
          </div>
        </div>
        <h2 class="card-title hero-title">NÚCLEO DE APRENDIZAJE</h2>
      </div>

      <!-- SATELLITE 2: EXPERTO HUMANO (Emerald Accent) -->
      <div class="bento-card card-satellite" id="card-right">
        <div class="badge-wrap">
          <div class="pulse-ring ring-emerald" id="pulse-right"></div>
          <div class="icon-badge badge-emerald">
            <!-- Lucide: UserCheck / Expert Demonstration -->
            <svg viewBox="0 0 24 24">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <polyline points="16 11 18 13 22 9"></polyline>
            </svg>
          </div>
        </div>
        <h2 class="card-title">EXPERTO HUMANO</h2>
      </div>

    </div>

    <!-- Editorial Bottom Progress Bar -->
    <div class="editorial-progress">
      <div class="editorial-fill" id="progress-fill"></div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Scale stage to fit viewport
      function handleResize() {
        const stage = document.getElementById("stage-scaler");
        const scaleX = window.innerWidth / 1920;
        const scaleY = window.innerHeight / 1080;
        const scale = Math.min(scaleX, scaleY);
        stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
      window.addEventListener('resize', handleResize);
      handleResize();

      // Master HyperFrames GSAP Timeline (10.0s strict)
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["rl_vs_imitation"] = tl;

      // Bottom progress bar
      tl.to("#progress-fill", { width: "100%", duration: 10, ease: "none" }, 0);

      // Setup vector path dashes
      const setupVector = (id) => {
        const p = document.getElementById(id);
        if (!p) return { path: null, len: 0 };
        const len = p.getTotalLength() + 4;
        gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        return { path: p, len };
      };

      const vl = setupVector("vector-left");
      const vr = setupVector("vector-right");

      // Initial visual states
      gsap.set("#header-bar", { opacity: 0, y: -16 });
      gsap.set(".bento-card", { opacity: 0, y: 32 });

      // 1. Header Reveal (0.2s)
      tl.to("#header-bar", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);

      // 2. Left Satellite (Agente Autónomo) Activation (0.7s)
      tl.to("#card-left", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)",
        onStart: () => document.getElementById("card-left").classList.add("active")
      }, 0.7);
      tl.fromTo("#pulse-left", { scale: 0.85, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.9);

      // 3. Right Satellite (Experto Humano) Activation (2.2s)
      tl.to("#card-right", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)",
        onStart: () => document.getElementById("card-right").classList.add("active")
      }, 2.2);
      tl.fromTo("#pulse-right", { scale: 0.85, opacity: 0.9 }, { scale: 1.8, opacity: 0, duration: 0.6, ease: "power2.out" }, 2.4);

      // 4. Dual Convergent Vector Streams heading into Center Hero (3.8s)
      // Left -> Center
      tl.to(vl.path, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 3.8);
      tl.set("#pkt-left", { opacity: 1 }, 3.8);
      tl.to("#pkt-left", {
        duration: 0.6, ease: "power2.inOut",
        onUpdate: function() {
          const pt = vl.path.getPointAtLength(this.progress() * vl.len);
          const el = document.getElementById("pkt-left");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 3.8);
      tl.set("#pkt-left", { opacity: 0 }, 4.4);

      // Right -> Center
      tl.to(vr.path, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 3.8);
      tl.set("#pkt-right", { opacity: 1 }, 3.8);
      tl.to("#pkt-right", {
        duration: 0.6, ease: "power2.inOut",
        onUpdate: function() {
          const pt = vr.path.getPointAtLength(this.progress() * vr.len);
          const el = document.getElementById("pkt-right");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 3.8);
      tl.set("#pkt-right", { opacity: 0 }, 4.4);

      // 5. Center Dominant Hero Activation & Harmonic Resonance (4.4s)
      tl.to("#card-center", {
        opacity: 1, y: 0, duration: 0.85, ease: "back.out(1.5)",
        onStart: () => {
          document.getElementById("card-center").classList.add("active");
        }
      }, 4.4);
      tl.fromTo("#pulse-center", { scale: 0.85, opacity: 0.95 }, { scale: 2.1, opacity: 0, duration: 0.8, ease: "power2.out" }, 4.6);

      // 6. Full Illumination Final State Hold (7.4s - 10.0s)
      tl.to(".bento-card", {
        opacity: 1,
        y: 0,
        duration: 0.6,
        onStart: () => {
          document.querySelectorAll(".bento-card").forEach(c => c.classList.add("active"));
        }
      }, 7.4);

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') tl.paused(!tl.paused());
        if (e.code === 'KeyR') tl.restart();
      });

      // Play
      tl.play();
    });
  </script>
</body>
</html>
