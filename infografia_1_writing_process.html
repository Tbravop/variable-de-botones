<!DOCTYPE html>
<html lang="es" data-fps="30" data-duration="10" data-width="1920" data-height="1080">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Infografía 01: Proceso Editorial // Minimalist Bento Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800;900&family=Montserrat:wght@800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg-midnight: #0B0F19;
      --card-bg: rgba(19, 26, 42, 0.94);
      --card-border: #232E47;
      
      --cyan: #38BDF8;
      --cyan-glow: rgba(56, 189, 248, 0.45);
      
      --purple: #A855F7;
      --purple-glow: rgba(168, 85, 247, 0.45);
      
      --emerald: #10B981;
      --emerald-glow: rgba(16, 185, 129, 0.45);
      
      --amber: #F59E0B;
      --amber-glow: rgba(245, 158, 11, 0.45);
      
      --text-white: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-midnight);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
    }

    #stage-scaler {
      position: absolute;
      width: 1920px;
      height: 1080px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      background: radial-gradient(circle at 50% 25%, #151F38 0%, #0B0F19 65%, #060911 100%);
      overflow: hidden;
      box-shadow: 0 0 120px rgba(0, 0, 0, 0.95);
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .bento-container {
      position: absolute;
      top: 60px;
      left: 90px;
      right: 90px;
      height: 720px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      z-index: 10;
    }

    .bento-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1.5px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* TOP WIDE BANNER CARD */
    .banner-card {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 50px;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
    }

    .banner-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--text-white);
      text-transform: uppercase;
      line-height: 1;
    }

    .banner-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: rgba(56, 189, 248, 0.12);
      border: 1.5px solid var(--cyan);
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 0 0 20px var(--cyan-glow);
    }

    .banner-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    /* 5 EQUAL VERTICAL BENTO CARDS */
    .cards-row-5 {
      width: 100%;
      height: 568px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      position: relative;
    }

    .vertical-card {
      height: 100%;
      padding: 36px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      opacity: 0;
      transform: translateY(35px);
    }

    .card-accent-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 900;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .icon-hero-box {
      width: 100px;
      height: 100px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 15px 0;
      transition: all 0.4s ease;
    }

    .icon-hero-box svg {
      width: 52px;
      height: 52px;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .sonar-ring {
      position: absolute;
      inset: -10px;
      border-radius: 32px;
      opacity: 0;
      pointer-events: none;
    }

    .card-hero-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--text-white);
      text-transform: uppercase;
      line-height: 1.15;
    }

    .card-visual-plate {
      width: 100%;
      height: 105px;
      border-radius: 14px;
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-visual-plate svg {
      width: 55px;
      height: 55px;
      fill: none;
      stroke-width: 1.8;
    }

    /* CARD COLORS */
    .card-c1 { border-top: 3px solid var(--cyan); }
    .card-c1 .card-accent-pill { color: var(--cyan); border-color: rgba(56,189,248,0.35); background: rgba(56,189,248,0.1); }
    .card-c1 .icon-hero-box { background: rgba(56,189,248,0.1); border: 2px solid var(--cyan); color: var(--cyan); box-shadow: 0 0 30px var(--cyan-glow); }
    .card-c1 .card-visual-plate svg { stroke: var(--cyan); filter: drop-shadow(0 0 8px var(--cyan-glow)); }
    .card-c1.active { border-color: var(--cyan); box-shadow: 0 20px 50px rgba(56,189,248,0.25); transform: translateY(-8px); }

    .card-c2 { border-top: 3px solid var(--purple); }
    .card-c2 .card-accent-pill { color: var(--purple); border-color: rgba(168,85,247,0.35); background: rgba(168,85,247,0.1); }
    .card-c2 .icon-hero-box { background: rgba(168,85,247,0.1); border: 2px solid var(--purple); color: var(--purple); box-shadow: 0 0 30px var(--purple-glow); }
    .card-c2 .card-visual-plate svg { stroke: var(--purple); filter: drop-shadow(0 0 8px var(--purple-glow)); }
    .card-c2.active { border-color: var(--purple); box-shadow: 0 20px 50px rgba(168,85,247,0.25); transform: translateY(-8px); }

    .card-c3 { border-top: 3px solid var(--emerald); }
    .card-c3 .card-accent-pill { color: var(--emerald); border-color: rgba(16,185,129,0.35); background: rgba(16,185,129,0.1); }
    .card-c3 .icon-hero-box { background: rgba(16,185,129,0.1); border: 2px solid var(--emerald); color: var(--emerald); box-shadow: 0 0 30px var(--emerald-glow); }
    .card-c3 .card-visual-plate svg { stroke: var(--emerald); filter: drop-shadow(0 0 8px var(--emerald-glow)); }
    .card-c3.active { border-color: var(--emerald); box-shadow: 0 20px 50px rgba(16,185,129,0.25); transform: translateY(-8px); }

    .card-c4 { border-top: 3px solid var(--amber); }
    .card-c4 .card-accent-pill { color: var(--amber); border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.1); }
    .card-c4 .icon-hero-box { background: rgba(245,158,11,0.1); border: 2px solid var(--amber); color: var(--amber); box-shadow: 0 0 30px var(--amber-glow); }
    .card-c4 .card-visual-plate svg { stroke: var(--amber); filter: drop-shadow(0 0 8px var(--amber-glow)); }
    .card-c4.active { border-color: var(--amber); box-shadow: 0 20px 50px rgba(245,158,11,0.25); transform: translateY(-8px); }

    .card-c5 { border: 2px solid var(--cyan); box-shadow: 0 16px 45px rgba(56,189,248,0.2); }
    .card-c5 .card-accent-pill { color: #FFFFFF; background: var(--cyan); border-color: var(--cyan); color: #000; font-weight: 900; }
    .card-c5 .icon-hero-box { background: linear-gradient(135deg, rgba(56,189,248,0.3), rgba(11,15,25,0.9)); border: 2px solid var(--cyan); color: var(--cyan); box-shadow: 0 0 35px var(--cyan-glow); }
    .card-c5 .card-visual-plate svg { stroke: var(--cyan); filter: drop-shadow(0 0 10px var(--cyan-glow)); }
    .card-c5.active { box-shadow: 0 25px 60px rgba(56,189,248,0.35); transform: translateY(-8px) scale(1.02); }

    /* CONNECTING LASER BEAMS */
    #connecting-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
    }

    .laser-wire {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-dasharray: 6 6;
    }

    .laser-active {
      fill: none;
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-dashoffset: 400;
    }

    .laser-packet {
      fill: #FFFFFF;
      opacity: 0;
    }

    .tv-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 50;
    }

    .tv-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--emerald), var(--amber), var(--cyan));
      box-shadow: 0 0 15px var(--cyan);
    }
  </style>
</head>
<body>

  <div id="stage-scaler" data-composition-id="writing_process" data-width="1920" data-height="1080" data-duration="10">
    <div class="bg-grid"></div>

    <div class="bento-container">

      <!-- TOP WIDE BANNER CARD -->
      <div class="bento-card banner-card" id="banner-card">
        <h1 class="banner-title">PROCESO EDITORIAL</h1>
        <div class="banner-badge">
          <div class="dot"></div>
          2026 BENTO PIPELINE
        </div>
      </div>

      <!-- 5 EQUAL VERTICAL BENTO CARDS -->
      <div class="cards-row-5">

        <!-- Laser Beams SVG between cards -->
        <svg id="connecting-svg" viewBox="0 0 1740 568">
          <!-- 1 to 2 -->
          <path class="laser-wire" d="M 332 284 L 352 284" />
          <path id="laser-1" class="laser-active" stroke="var(--cyan)" d="M 332 284 L 352 284" filter="drop-shadow(0 0 8px var(--cyan))" />
          <circle id="pkt-1" class="laser-packet" r="5" filter="drop-shadow(0 0 10px var(--cyan))" />

          <!-- 2 to 3 -->
          <path class="laser-wire" d="M 684 284 L 704 284" />
          <path id="laser-2" class="laser-active" stroke="var(--purple)" d="M 684 284 L 704 284" filter="drop-shadow(0 0 8px var(--purple))" />
          <circle id="pkt-2" class="laser-packet" r="5" filter="drop-shadow(0 0 10px var(--purple))" />

          <!-- 3 to 4 -->
          <path class="laser-wire" d="M 1036 284 L 1056 284" />
          <path id="laser-3" class="laser-active" stroke="var(--emerald)" d="M 1036 284 L 1056 284" filter="drop-shadow(0 0 8px var(--emerald))" />
          <circle id="pkt-3" class="laser-packet" r="5" filter="drop-shadow(0 0 10px var(--emerald))" />

          <!-- 4 to 5 -->
          <path class="laser-wire" d="M 1388 284 L 1408 284" />
          <path id="laser-4" class="laser-active" stroke="var(--amber)" d="M 1388 284 L 1408 284" filter="drop-shadow(0 0 8px var(--amber))" />
          <circle id="pkt-4" class="laser-packet" r="5" filter="drop-shadow(0 0 10px var(--amber))" />
        </svg>

        <!-- CARD 1: 01 PRE-ESCRITURA -->
        <div class="bento-card vertical-card card-c1" id="card-1">
          <div class="card-accent-pill">FASE 01</div>
          
          <div class="icon-hero-box">
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <path d="M12 2a7 7 0 0 0-7 7c0 2.5 1.5 4.5 3 6v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2c1.5-1.5 3-3.5 3-6a7 7 0 0 0-7-7z"/>
              <path d="M9 21h6"/>
            </svg>
            <div class="sonar-ring" id="sonar-1" style="border: 2px solid var(--cyan);"></div>
          </div>

          <h2 class="card-hero-title">01 PRE-ESCRITURA</h2>

          <div class="card-visual-plate">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </div>
        </div>

        <!-- CARD 2: 02 BORRADOR -->
        <div class="bento-card vertical-card card-c2" id="card-2">
          <div class="card-accent-pill">FASE 02</div>

          <div class="icon-hero-box">
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
            </svg>
            <div class="sonar-ring" id="sonar-2" style="border: 2px solid var(--purple);"></div>
          </div>

          <h2 class="card-hero-title">02 BORRADOR</h2>

          <div class="card-visual-plate">
            <svg viewBox="0 0 24 24">
              <path d="M12 19l7-7 3 3-7 7-3-3z"/>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            </svg>
          </div>
        </div>

        <!-- CARD 3: 03 REESCRITURA -->
        <div class="bento-card vertical-card card-c3" id="card-3">
          <div class="card-accent-pill">FASE 03</div>

          <div class="icon-hero-box">
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            <div class="sonar-ring" id="sonar-3" style="border: 2px solid var(--emerald);"></div>
          </div>

          <h2 class="card-hero-title">03 REESCRITURA</h2>

          <div class="card-visual-plate">
            <svg viewBox="0 0 24 24">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </div>
        </div>

        <!-- CARD 4: 04 EDICIÓN -->
        <div class="bento-card vertical-card card-c4" id="card-4">
          <div class="card-accent-pill">FASE 04</div>

          <div class="icon-hero-box">
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <div class="sonar-ring" id="sonar-4" style="border: 2px solid var(--amber);"></div>
          </div>

          <h2 class="card-hero-title">04 EDICIÓN</h2>

          <div class="card-visual-plate">
            <svg viewBox="0 0 24 24">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
          </div>
        </div>

        <!-- CARD 5: 05 PUBLICACIÓN -->
        <div class="bento-card vertical-card card-c5" id="card-5">
          <div class="card-accent-pill">FASE 05</div>

          <div class="icon-hero-box">
            <svg viewBox="0 0 24 24" stroke="currentColor">
              <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
              <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
            </svg>
            <div class="sonar-ring" id="sonar-5" style="border: 2px solid var(--cyan);"></div>
          </div>

          <h2 class="card-hero-title" style="color: var(--cyan);">05 PUBLICACIÓN</h2>

          <div class="card-visual-plate">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
          </div>
        </div>

      </div>

    </div>

    <!-- TV PROGRESS BAR -->
    <div class="tv-progress-track">
      <div class="tv-progress-fill" id="progress-bar"></div>
    </div>
  </div>

  <script>
    function updateScale() {
      const scaler = document.getElementById('stage-scaler');
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY);
      scaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', updateScale);
    updateScale();

    window.addEventListener('DOMContentLoaded', () => {
      const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.5 });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') tl.paused(!tl.paused());
        if (e.code === 'KeyR') tl.restart();
      });

      tl.to("#progress-bar", { width: "100%", duration: 10, ease: "none" }, 0);

      const p1 = document.getElementById("laser-1");
      const len1 = p1.getTotalLength() + 5;
      gsap.set(p1, { strokeDasharray: len1, strokeDashoffset: len1 });

      const p2 = document.getElementById("laser-2");
      const len2 = p2.getTotalLength() + 5;
      gsap.set(p2, { strokeDasharray: len2, strokeDashoffset: len2 });

      const p3 = document.getElementById("laser-3");
      const len3 = p3.getTotalLength() + 5;
      gsap.set(p3, { strokeDasharray: len3, strokeDashoffset: len3 });

      const p4 = document.getElementById("laser-4");
      const len4 = p4.getTotalLength() + 5;
      gsap.set(p4, { strokeDasharray: len4, strokeDashoffset: len4 });

      gsap.set("#banner-card", { opacity: 0, y: -20 });
      gsap.set([".vertical-card"], { opacity: 0, y: 30 });

      // 1. Banner (0.2s)
      tl.to("#banner-card", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);

      // 2. Card 1 (0.6s)
      tl.to("#card-1", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.5)",
        onStart: () => document.getElementById("card-1").classList.add("active")
      }, 0.6);
      tl.fromTo("#sonar-1", { scale: 0.8, opacity: 1 }, { scale: 2.2, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.8);

      // Stream 1 to 2 (1.8s)
      tl.to(p1, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 1.8);
      tl.set("#pkt-1", { opacity: 1 }, 1.8);
      tl.to("#pkt-1", {
        duration: 0.5, ease: "power2.inOut",
        onUpdate: function() {
          const pt = p1.getPointAtLength(this.progress() * len1);
          const el = document.getElementById("pkt-1");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 1.8);
      tl.set("#pkt-1", { opacity: 0 }, 2.3);

      // 3. Card 2 (2.2s)
      tl.to("#card-2", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.5)",
        onStart: () => {
          document.getElementById("card-1").classList.remove("active");
          document.getElementById("card-2").classList.add("active");
        }
      }, 2.2);
      tl.fromTo("#sonar-2", { scale: 0.8, opacity: 1 }, { scale: 2.2, opacity: 0, duration: 0.6, ease: "power2.out" }, 2.4);

      // Stream 2 to 3 (3.4s)
      tl.to(p2, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 3.4);
      tl.set("#pkt-2", { opacity: 1 }, 3.4);
      tl.to("#pkt-2", {
        duration: 0.5, ease: "power2.inOut",
        onUpdate: function() {
          const pt = p2.getPointAtLength(this.progress() * len2);
          const el = document.getElementById("pkt-2");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 3.4);
      tl.set("#pkt-2", { opacity: 0 }, 3.9);

      // 4. Card 3 (3.8s)
      tl.to("#card-3", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.5)",
        onStart: () => {
          document.getElementById("card-2").classList.remove("active");
          document.getElementById("card-3").classList.add("active");
        }
      }, 3.8);
      tl.fromTo("#sonar-3", { scale: 0.8, opacity: 1 }, { scale: 2.2, opacity: 0, duration: 0.6, ease: "power2.out" }, 4.0);

      // Stream 3 to 4 (5.0s)
      tl.to(p3, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 5.0);
      tl.set("#pkt-3", { opacity: 1 }, 5.0);
      tl.to("#pkt-3", {
        duration: 0.5, ease: "power2.inOut",
        onUpdate: function() {
          const pt = p3.getPointAtLength(this.progress() * len3);
          const el = document.getElementById("pkt-3");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 5.0);
      tl.set("#pkt-3", { opacity: 0 }, 5.5);

      // 5. Card 4 (5.4s)
      tl.to("#card-4", {
        opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.5)",
        onStart: () => {
          document.getElementById("card-3").classList.remove("active");
          document.getElementById("card-4").classList.add("active");
        }
      }, 5.4);
      tl.fromTo("#sonar-4", { scale: 0.8, opacity: 1 }, { scale: 2.2, opacity: 0, duration: 0.6, ease: "power2.out" }, 5.6);

      // Stream 4 to 5 (6.6s)
      tl.to(p4, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 6.6);
      tl.set("#pkt-4", { opacity: 1 }, 6.6);
      tl.to("#pkt-4", {
        duration: 0.5, ease: "power2.inOut",
        onUpdate: function() {
          const pt = p4.getPointAtLength(this.progress() * len4);
          const el = document.getElementById("pkt-4");
          el.setAttribute("cx", pt.x); el.setAttribute("cy", pt.y);
        }
      }, 6.6);
      tl.set("#pkt-4", { opacity: 0 }, 7.1);

      // 6. Card 5 (7.0s)
      tl.to("#card-5", {
        opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)",
        onStart: () => {
          document.getElementById("card-4").classList.remove("active");
          document.getElementById("card-5").classList.add("active");
        }
      }, 7.0);
      tl.fromTo("#sonar-5", { scale: 0.8, opacity: 1 }, { scale: 2.3, opacity: 0, duration: 0.6, ease: "power2.out" }, 7.2);

      // 7. Full Illumination Harmony (8.5s - 10s)
      tl.to([".vertical-card"], {
        opacity: 1,
        duration: 0.5,
        onComplete: () => {
          document.querySelectorAll(".vertical-card").forEach(c => c.classList.add("active"));
        }
      }, 8.5);
    });
  </script>
</body>
</html>
